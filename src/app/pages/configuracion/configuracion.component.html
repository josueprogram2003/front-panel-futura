<div class="fade-in">
  <p-toast></p-toast>

  <!-- Header -->
  <div class="mb-6 pb-5 border-b border-[#f0ede8] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-1.5 mb-1.5">
        <i class="pi pi-cog text-xs text-[#2563eb]"></i>
        <span class="text-[11px] font-bold uppercase tracking-[0.08em] text-[#2563eb]">Sistema</span>
      </div>
      <h1 class="text-2xl font-bold text-[#1c1917] tracking-tight">Configuración</h1>
      <p class="text-sm text-[#78716c] mt-1">Ajusta los parámetros del sistema.</p>
    </div>
    <div class="flex items-center gap-2 rounded-xl border border-[#dbeafe] bg-[#eff6ff] px-3.5 py-2.5 self-start sm:self-auto">
      <i class="pi pi-shield text-sm text-[#2563eb]"></i>
      <span class="text-xs font-semibold text-[#1d4ed8]">Cambios guardados en tiempo real</span>
    </div>
  </div>

  <p-tabView styleClass="w-full">

    <!-- Tab: Totem -->
    <p-tabPanel header="Tótem fotográfico" leftIcon="pi pi-camera">
      <div class="mt-5 max-w-lg" [formGroup]="configForm">
        <div class="flex items-center justify-between rounded-xl border border-[#e4e0da] bg-[#f7f6f3] p-5">
          <div>
            <p class="text-sm font-semibold text-[#1c1917]">Impresora activa</p>
            <p class="text-xs text-[#78716c] mt-0.5">Habilita o deshabilita la impresión de tickets</p>
          </div>
          <p-toggleswitch formControlName="isActiveImpresora"></p-toggleswitch>
        </div>
      </div>
    </p-tabPanel>

    <!-- Tab: Trivia -->
    <p-tabPanel header="Trivia" leftIcon="pi pi-question-circle">
      <div class="mt-5" [formGroup]="configForm">
        <h2 class="text-sm font-bold text-[#1c1917] mb-4 pb-3 border-b border-[#f0ede8]">
          Personalización de colores
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 max-w-2xl">

          <div class="field">
            <label class="block text-sm font-medium text-[#44403c] mb-2">Color texto pregunta</label>
            <div class="flex items-center gap-3">
              <p-colorpicker
                [ngModel]="colors.text_color_pregunta"
                (ngModelChange)="updateColor('text_color_pregunta', $event)"
                [ngModelOptions]="{standalone: true}">
              </p-colorpicker>
              <input type="text" pInputText
                [ngModel]="colors.text_color_pregunta"
                (ngModelChange)="updateColor('text_color_pregunta', $event)"
                [ngModelOptions]="{standalone: true}"
                class="w-28 font-mono text-sm" />
            </div>
          </div>

          <div class="field">
            <label class="block text-sm font-medium text-[#44403c] mb-2">Color texto alternativa</label>
            <div class="flex items-center gap-3">
              <p-colorpicker
                [ngModel]="colors.text_color_alternativa"
                (ngModelChange)="updateColor('text_color_alternativa', $event)"
                [ngModelOptions]="{standalone: true}">
              </p-colorpicker>
              <input type="text" pInputText
                [ngModel]="colors.text_color_alternativa"
                (ngModelChange)="updateColor('text_color_alternativa', $event)"
                [ngModelOptions]="{standalone: true}"
                class="w-28 font-mono text-sm" />
            </div>
          </div>

          <div class="field">
            <label class="block text-sm font-medium text-[#44403c] mb-2">Fondo respuesta seleccionada</label>
            <div class="flex items-center gap-3">
              <p-colorpicker
                [ngModel]="colors.color_boton_alternativa"
                (ngModelChange)="updateColor('color_boton_alternativa', $event)"
                [ngModelOptions]="{standalone: true}">
              </p-colorpicker>
              <input type="text" pInputText
                [ngModel]="colors.color_boton_alternativa"
                (ngModelChange)="updateColor('color_boton_alternativa', $event)"
                [ngModelOptions]="{standalone: true}"
                class="w-28 font-mono text-sm" />
            </div>
          </div>

          <div class="field">
            <label class="block text-sm font-medium text-[#44403c] mb-2">Color numeración</label>
            <div class="flex items-center gap-3">
              <p-colorpicker
                [ngModel]="colors.color_numeracion"
                (ngModelChange)="updateColor('color_numeracion', $event)"
                [ngModelOptions]="{standalone: true}">
              </p-colorpicker>
              <input type="text" pInputText
                [ngModel]="colors.color_numeracion"
                (ngModelChange)="updateColor('color_numeracion', $event)"
                [ngModelOptions]="{standalone: true}"
                class="w-28 font-mono text-sm" />
            </div>
          </div>

        </div>
      </div>
    </p-tabPanel>

  </p-tabView>

  <!-- Footer actions -->
  <div class="mt-8 flex flex-col-reverse sm:flex-row justify-end gap-2.5 border-t border-[#f0ede8] pt-5">
    <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary"
      styleClass="w-full sm:w-auto">
    </p-button>
    <p-button label="Guardar cambios" icon="pi pi-check" styleClass="btn-primary w-full sm:w-auto"
      [rounded]="true" (onClick)="saveConfig()">
    </p-button>
  </div>
</div>
