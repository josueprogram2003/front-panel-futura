<div class="h-full w-full bg-slate-900 text-white flex flex-col shadow-2xl border-r border-slate-800 relative">
  
  <!-- Close Button (Mobile Only) -->
  <button (click)="closeSidebar.emit()" class="md:hidden absolute top-4 right-4 text-slate-400 hover:text-white p-2">
    <i class="pi pi-times text-xl"></i>
  </button>

  <!-- Logo / Brand -->
  <div class="p-4 md:p-6 border-b border-slate-800 flex items-center gap-3 cursor-pointer hover:bg-slate-800/50 transition-colors" routerLink="/panel/bienvenidos" (click)="closeSidebar.emit()">
    <div class="w-8 h-8 md:w-8 md:h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
      <span class="font-bold text-white text-base md:text-lg">F</span>
    </div>
    <h1 class="text-base md:text-lg font-bold tracking-wide text-white">FUTURA</h1>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 md:py-6 px-2 md:px-3">
    
    <!-- General Section -->
    <div class="mb-2 px-4 text-[10px] md:text-xs font-semibold text-slate-500 uppercase tracking-wider">General</div>
    <ul class="space-y-1 mb-6">
      <!-- Configuración -->
      <li>
        <a routerLink="/panel/configuracion" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500" pRipple
           (click)="closeSidebar.emit()"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all duration-200 rounded-r-lg border-l-4 border-transparent group cursor-pointer relative overflow-hidden">
          <i class="pi pi-cog text-base md:text-lg group-hover:animate-spin-slow"></i>
          <span class="text-sm md:text-base">Configuración</span>
        </a>
      </li>
    </ul>

    <!-- Trivia Section -->
    <div class="mb-2 px-4 text-[10px] md:text-xs font-semibold text-slate-500 uppercase tracking-wider">Trivia</div>
    <ul class="space-y-1">
      <!-- Eventos y Preguntas -->
      <li>
        <a routerLink="/panel/eventos" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500" pRipple
           (click)="closeSidebar.emit()"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all duration-200 rounded-r-lg border-l-4 border-transparent group cursor-pointer relative overflow-hidden">
          <i class="pi pi-calendar text-base md:text-lg group-hover:text-blue-400 transition-colors"></i>
          <span class="text-sm md:text-base">Eventos</span>
        </a>
      </li>

      <!-- Dificultades -->
      <li>
        <a routerLink="/panel/dificultades" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500" pRipple
           (click)="closeSidebar.emit()"
           class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all duration-200 rounded-r-lg border-l-4 border-transparent group cursor-pointer relative overflow-hidden">
          <i class="pi pi-tags text-base md:text-lg group-hover:text-blue-400 transition-colors"></i>
          <span class="text-sm md:text-base">Dificultades</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User Profile -->
  <div class="p-4 border-t border-slate-800 bg-slate-900/50">
    <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800 transition-colors cursor-pointer group">
      <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white shadow-lg">
        <span class="font-bold text-xs md:text-sm">AD</span>
      </div>
      <div class="overflow-hidden">
        <p class="text-xs md:text-sm font-semibold text-white group-hover:text-blue-400 transition-colors truncate">Administrador</p>
        <p class="text-[10px] md:text-xs text-slate-500 truncate">admin&#64;futura.com</p>
      </div>
      <i class="pi pi-chevron-right ml-auto text-[10px] md:text-xs text-slate-600 group-hover:text-slate-400"></i>
    </div>
  </div>
</div>
