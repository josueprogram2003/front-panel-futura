<div class="flex h-full flex-col bg-[#0f172a]">

  <!-- Brand -->
  <div
    class="flex items-center gap-3 px-4 py-[1.1rem] border-b border-white/10 cursor-pointer select-none"
    routerLink="/panel/bienvenidos"
    (click)="closeSidebar.emit()"
  >
    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#2563eb] text-white flex-shrink-0 shadow-[0_0_16px_rgba(37,99,235,0.5)]">
      <span class="text-sm font-black tracking-wide">F</span>
    </div>
    <div class="min-w-0">
      <h1 class="text-sm font-bold text-white tracking-tight leading-none">FUTURA</h1>
      <p class="text-[11px] text-white/40 mt-0.5 leading-none">Panel administrativo</p>
    </div>
  </div>

  <!-- Close (mobile) -->
  <button
    (click)="closeSidebar.emit()"
    class="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-lg text-white/40 transition hover:bg-white/10 hover:text-white/80 md:hidden"
  >
    <i class="pi pi-times text-sm"></i>
  </button>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
    <section *ngFor="let section of menuSections">
      <p class="px-2 mb-1.5 text-[10px] font-bold uppercase tracking-[0.1em] text-white/30">
        {{ section.title }}
      </p>
      <div class="space-y-0.5">
        <a
          *ngFor="let item of section.items"
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          routerLinkActive="sidebar-active"
          pRipple
          (click)="closeSidebar.emit()"
          class="sidebar-link"
        >
          <span class="sidebar-icon">
            <i class="pi text-sm" [ngClass]="item.icon"></i>
          </span>
          <span class="text-sm">{{ item.label }}</span>
        </a>
      </div>
    </section>
  </nav>

  <!-- User -->
  <div *ngIf="user$ | async as user" class="border-t border-white/10 px-3 py-3.5">
    <div class="rounded-xl bg-white/8 border border-white/10 p-3 flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#2563eb]/80 text-sm font-bold text-white flex-shrink-0">
        {{ user.initials }}
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-white/90 leading-snug">{{ user.name }}</p>
        <p class="truncate text-[11px] text-white/40 leading-snug">{{ user.role }}</p>
      </div>
      <button
        type="button"
        (click)="logout()"
        title="Cerrar sesión"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-white/35 transition hover:bg-white/10 hover:text-red-400 flex-shrink-0"
      >
        <i class="pi pi-sign-out text-sm"></i>
      </button>
    </div>
  </div>

</div>
