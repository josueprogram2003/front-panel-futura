<div *ngIf="isAuthRoute; else panelShell" class="min-h-screen bg-[#f7f6f3]">
  <router-outlet></router-outlet>
</div>

<ng-template #panelShell>
  <div class="flex h-screen overflow-hidden bg-[#f7f6f3]">

    <!-- Mobile top bar -->
    <div class="md:hidden fixed inset-x-0 top-0 z-30 flex h-14 items-center justify-between border-b border-[#e4e0da] bg-[#0f172a] px-4">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#2563eb] text-white shadow-[0_0_12px_rgba(37,99,235,0.5)]">
          <span class="text-xs font-black tracking-wide">F</span>
        </div>
        <span class="text-sm font-bold text-white tracking-tight">Futura</span>
      </div>
      <button
        (click)="toggleSidebar()"
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-white/15 text-white/60 transition hover:bg-white/10 hover:text-white"
      >
        <i class="pi pi-bars text-sm"></i>
      </button>
    </div>

    <!-- Mobile overlay -->
    <div
      *ngIf="isSidebarOpen"
      (click)="closeSidebar()"
      class="fixed inset-0 z-40 bg-[#1c1917]/25 md:hidden"
    ></div>

    <!-- Sidebar -->
    <aside
      class="fixed inset-y-0 left-0 z-50 w-60 transform transition-transform duration-200 ease-out md:static md:w-60 md:translate-x-0"
      [class.-translate-x-full]="!isSidebarOpen"
      [class.translate-x-0]="isSidebarOpen"
    >
      <div class="h-full">
        <app-sidebar (closeSidebar)="closeSidebar()"></app-sidebar>
      </div>
    </aside>

    <!-- Main content -->
    <main class="relative flex-1 overflow-y-auto pt-14 md:pt-0">
      <div class="mx-auto min-h-full max-w-[1440px] p-4 md:p-5">
        <div class="min-h-[calc(100vh-2.5rem)] rounded-2xl border border-[#e4e0da] bg-white p-4 shadow-sm md:p-6 lg:p-7">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>

  </div>
</ng-template>
